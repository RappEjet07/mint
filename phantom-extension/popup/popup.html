<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperWallet</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 360px;
        min-height: 500px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          sans-serif;
        background: #0f0f1a;
        color: #e2e8f0;
        overflow-x: hidden;
      }

      /* Gradient background */
      .bg-gradient {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          radial-gradient(
            ellipse at 20% 20%,
            rgba(124, 58, 237, 0.15) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 80% 80%,
            rgba(6, 182, 212, 0.1) 0%,
            transparent 50%
          ),
          #0f0f1a;
        z-index: -1;
      }

      .container {
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        min-height: 500px;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
      }

      .logo-section {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
      }

      .wallet-name {
        font-size: 18px;
        font-weight: 700;
        background: linear-gradient(135deg, #7c3aed, #2563eb, #06b6d4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .network-badge {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 20px;
        background: rgba(124, 58, 237, 0.2);
        color: #a78bfa;
        border: 1px solid rgba(124, 58, 237, 0.3);
        font-weight: 500;
      }

      /* Account Card */
      .account-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 24px;
        margin-bottom: 24px;
        backdrop-filter: blur(10px);
      }

      .account-label {
        font-size: 12px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 12px;
      }

      .address-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
      }

      .address {
        font-size: 14px;
        font-family: "SF Mono", "Fira Code", monospace;
        color: #e2e8f0;
        word-break: break-all;
        line-height: 1.4;
      }

      .copy-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: #94a3b8;
        padding: 4px;
        border-radius: 6px;
        transition: all 0.2s;
        flex-shrink: 0;
      }

      .copy-btn:hover {
        color: #7c3aed;
        background: rgba(124, 58, 237, 0.1);
      }

      .copy-btn svg {
        width: 16px;
        height: 16px;
      }

      .balance-section {
        text-align: center;
        padding-top: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .balance-label {
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 4px;
      }

      .balance-value {
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(135deg, #e2e8f0, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .balance-usd {
        font-size: 13px;
        color: #64748b;
        margin-top: 2px;
      }

      /* Connected Sites */
      .section-title {
        font-size: 13px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 12px;
      }

      .sites-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 24px;
      }

      .site-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
      }

      .site-url {
        font-size: 13px;
        color: #cbd5e1;
      }

      .site-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 6px rgba(34, 197, 94, 0.4);
      }

      .no-sites {
        font-size: 13px;
        color: #475569;
        text-align: center;
        padding: 16px;
      }

      /* Buttons */
      .actions {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .btn {
        width: 100%;
        padding: 14px;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
      }

      .btn-primary {
        background: linear-gradient(135deg, #7c3aed, #2563eb);
        color: white;
      }

      .btn-primary:hover {
        opacity: 0.9;
        transform: translateY(-1px);
        box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
      }

      .btn-danger {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.2);
      }

      .btn-danger:hover {
        background: rgba(239, 68, 68, 0.2);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: #94a3b8;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #e2e8f0;
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        padding: 10px 20px;
        background: rgba(124, 58, 237, 0.9);
        color: white;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
        transition: transform 0.3s ease;
        backdrop-filter: blur(10px);
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
      }

      /* Spinner */
      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin: 40px auto;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Footer */
      .footer {
        text-align: center;
        margin-top: 16px;
        font-size: 11px;
        color: #334155;
      }

      /* ===== Onboarding / Import Screen ===== */
      .onboard-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        text-align: center;
      }

      .onboard-logo {
        margin-bottom: 16px;
      }

      .onboard-title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 6px;
        background: linear-gradient(135deg, #7c3aed, #2563eb, #06b6d4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .onboard-subtitle {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 28px;
        line-height: 1.5;
      }

      /* Tabs */
      .tabs {
        display: flex;
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 12px;
        padding: 4px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .tab {
        flex: 1;
        padding: 10px 0;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        color: #64748b;
        transition: all 0.2s;
        border: none;
        background: none;
      }

      .tab.active {
        background: linear-gradient(135deg, #7c3aed, #2563eb);
        color: white;
        box-shadow: 0 2px 12px rgba(124, 58, 237, 0.3);
      }

      .tab:not(.active):hover {
        color: #94a3b8;
      }

      /* Input */
      .input-group {
        width: 100%;
        margin-bottom: 16px;
      }

      .input-label {
        font-size: 12px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        text-align: left;
        display: block;
      }

      .input-field {
        width: 100%;
        padding: 14px 16px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: #e2e8f0;
        font-size: 13px;
        font-family: "SF Mono", "Fira Code", monospace;
        outline: none;
        transition: border-color 0.2s;
        resize: vertical;
        min-height: 80px;
      }

      .input-field::placeholder {
        color: #475569;
      }

      .input-field:focus {
        border-color: #7c3aed;
        box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.15);
      }

      .input-hint {
        font-size: 11px;
        color: #475569;
        margin-top: 8px;
        text-align: left;
        line-height: 1.4;
      }

      .error-text {
        font-size: 12px;
        color: #ef4444;
        margin-top: 8px;
        text-align: left;
      }

      /* Generate section */
      .generate-info {
        background: rgba(124, 58, 237, 0.08);
        border: 1px solid rgba(124, 58, 237, 0.15);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 16px;
        width: 100%;
      }

      .generate-info-icon {
        font-size: 32px;
        margin-bottom: 8px;
      }

      .generate-info-text {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.6;
      }

      .warning-box {
        background: rgba(245, 158, 11, 0.08);
        border: 1px solid rgba(245, 158, 11, 0.2);
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 16px;
        width: 100%;
        text-align: left;
      }

      .warning-box p {
        font-size: 12px;
        color: #f59e0b;
        line-height: 1.5;
      }

      /* Export key area */
      .export-box {
        background: rgba(255, 255, 255, 0.03);
        border: 1px dashed rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 12px 16px;
        word-break: break-all;
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 11px;
        color: #94a3b8;
        line-height: 1.5;
        cursor: pointer;
        transition: all 0.2s;
      }

      .export-box:hover {
        border-color: #7c3aed;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div class="bg-gradient"></div>
    <div class="container" id="app">
      <div class="spinner" id="loader"></div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="popup.js"></script>
  </body>
</html>
